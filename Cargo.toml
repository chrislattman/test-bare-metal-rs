[package]
name = "test-bare-metal-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
arduino-hal = { path = "./avr-hal/arduino-hal", features = ["arduino-mega2560"] }
ufmt = "0.2.0"

[profile.dev]
panic = "abort"
lto = false
opt-level = "s"

# Leave our own code unoptimized so every source line keeps its own
# instructions (breakpoints land where they're set); dependencies stay at "s".
[profile.dev.package.test-bare-metal-rs]
opt-level = 0

[profile.release]
panic = "abort"
lto = true
opt-level = "s"
